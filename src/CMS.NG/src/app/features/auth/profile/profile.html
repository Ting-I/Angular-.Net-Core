<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header">
    <h1>個人資料 My Profile</h1>
    <div class="page-actions">
      <p-button
        label="還原"
        icon="pi pi-undo"
        severity="secondary"
        type="button"
        (onClick)="reset()"
      />
      <p-button
        label="儲存"
        icon="pi pi-check"
        severity="success"
        type="submit"
        [loading]="saving()"
      />
    </div>
  </div>

  <section class="page-card">
    <h2>帳號資料</h2>

    <div class="form-field">
      <label for="userId">使用者代碼</label>
      <input pInputText id="userId" formControlName="userId" data-testid="profile-user-id" />
      <small class="field-hint">使用者代碼為帳號主鍵，無法修改。</small>
    </div>

    <div class="form-field">
      <label for="userName">使用者名稱 <span class="required">*</span></label>
      <input
        pInputText
        id="userName"
        formControlName="userName"
        maxlength="200"
        data-testid="profile-user-name"
      />
      @if (isInvalid('userName')) {
        <small class="field-error">使用者名稱為必填。</small>
      }
    </div>
  </section>

  <section class="page-card">
    <h2>
      角色<span class="count-badge">{{ roles().length }}</span>
    </h2>
    @if (roles().length) {
      <div class="role-tags" data-testid="profile-roles">
        @for (role of roles(); track role) {
          <p-tag [value]="role" severity="secondary" />
        }
      </div>
    } @else {
      <p class="state-message" data-testid="profile-roles">尚未指派角色。</p>
    }
    <small class="field-hint">角色由系統管理員於「使用者 AppUser」指派，無法自行修改。</small>
  </section>
</form>
