<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header">
    <h1>{{ isEdit() ? '編輯角色' : '新增角色' }}</h1>
    <app-row-audit-badge tableName="AppRole" [pkid]="auditPkid()" />
    <div class="page-actions">
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        type="button"
        (onClick)="cancel()"
      />
      <p-button
        label="儲存"
        icon="pi pi-check"
        severity="success"
        type="submit"
        [loading]="saving()"
      />
    </div>
  </div>

  <section class="page-card">
    <h2>角色資料</h2>

    <div class="form-field">
      <label for="roleId">角色代碼 <span class="required">*</span></label>
      <input
        pInputText
        id="roleId"
        formControlName="roleId"
        placeholder="請輸入角色代碼"
        maxlength="200"
      />
      @if (isInvalid('roleId')) {
        <small class="field-error">角色代碼為必填。</small>
      }
    </div>

    <div class="form-field">
      <label for="roleName">角色名稱 <span class="required">*</span></label>
      <input pInputText id="roleName" formControlName="roleName" maxlength="200" />
      @if (isInvalid('roleName')) {
        <small class="field-error">角色名稱為必填。</small>
      }
    </div>

    <div class="form-field">
      <label for="permissionLevel">權限等級 <span class="required">*</span></label>
      <p-inputNumber
        inputId="permissionLevel"
        formControlName="permissionLevel"
        [min]="0"
        [useGrouping]="false"
      />
      @if (isInvalid('permissionLevel')) {
        <small class="field-error">權限等級為必填且不可小於 0。</small>
      }
    </div>

    <div class="form-field">
      <label for="description">描述</label>
      <input pInputText id="description" formControlName="description" maxlength="400" />
      @if (isInvalid('description')) {
        <small class="field-error">描述長度不可超過 400 字。</small>
      }
    </div>
  </section>

  <section class="page-card">
    <h2>使用者</h2>
    <p-multiselect
      inputId="userIds"
      formControlName="userIds"
      [options]="userOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="選擇使用者（可複選）"
      appendTo="body"
      [filter]="true"
      [showClear]="true"
      [maxSelectedLabels]="9999"
      [virtualScroll]="true"
      [virtualScrollItemSize]="43"
      display="chip"
      styleClass="user-multiselect"
    />
  </section>
</form>
