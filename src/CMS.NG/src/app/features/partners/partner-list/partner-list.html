<p-toast />
<p-confirmDialog />

<div class="page-header">
  <div class="page-title">
    <h1>原廠 Partner</h1>
    <span class="page-subtitle">課程原廠／品牌合作夥伴</span>
  </div>
  <div class="page-actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? activeFilterCount.toString() : undefined"
      (onClick)="openFilterDrawer()"
    />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="page.rows"
    [first]="page.first"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    [totalRecords]="partners().length"
    dataKey="pkid"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [showCurrentPageReport]="true"
    paginatorPosition="top"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">原廠名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 8rem">
          應用代碼 <p-sortIcon field="appKey" />
        </th>
        <th pSortableColumn="nameOnPartnerMenu">
          選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" />
        </th>
        <th pSortableColumn="nameOnCourseDetailPage">
          課程頁顯示名稱 <p-sortIcon field="nameOnCourseDetailPage" />
        </th>
        <th pSortableColumn="displayOrder" style="width: 7rem" class="text-right">
          顯示順序 <p-sortIcon field="displayOrder" />
        </th>
        <th pSortableColumn="imageFilename" style="width: 10rem">
          圖片檔名 <p-sortIcon field="imageFilename" />
        </th>
        <th style="width: 7rem" class="text-right">引用數</th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-partner>
      <tr>
        <td>{{ partner.pkid }}</td>
        <td>{{ partner.name }}</td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td>{{ partner.nameOnCourseDetailPage }}</td>
        <td class="text-right">{{ partner.displayOrder }}</td>
        <td>{{ partner.imageFilename || '—' }}</td>
        <td class="text-right">
          <span [pTooltip]="referenceBreakdown(partner)" tooltipPosition="left">
            {{ referenceCount(partner) }}
          </span>
        </td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="info"
              [text]="true"
              [rounded]="true"
              ariaLabel="檢視"
              (onClick)="view(partner)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="primary"
              [text]="true"
              [rounded]="true"
              ariaLabel="編輯"
              (onClick)="edit(partner)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              ariaLabel="刪除"
              (onClick)="confirmDelete(partner)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="9" class="empty-row">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [(visible)]="filterDrawerVisible"
  header="搜尋條件"
  position="right"
  styleClass="filter-drawer"
>
  <div class="filter-field">
    <label for="filter-keyword">關鍵字</label>
    <input
      pInputText
      id="filter-keyword"
      name="keyword"
      placeholder="原廠名稱、應用代碼、顯示名稱"
      [(ngModel)]="draftFilters.keyword"
      (keyup.enter)="applyFilters()"
    />
  </div>

  <div class="filter-field">
    <label for="filter-has-image">圖片</label>
    <p-select
      inputId="filter-has-image"
      name="hasImage"
      [options]="hasImageOptions"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      [(ngModel)]="draftFilters.hasImage"
    />
  </div>

  <div class="filter-actions">
    <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
