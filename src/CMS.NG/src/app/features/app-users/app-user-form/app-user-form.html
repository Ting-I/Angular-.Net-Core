<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header">
    <h1>{{ isEdit() ? '編輯使用者' : '新增使用者' }}</h1>
    <app-row-audit-badge tableName="AppUser" [pkid]="auditPkid()" />
    <div class="page-actions">
      <p-button
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        type="button"
        (onClick)="cancel()"
      />
      <p-button
        label="儲存"
        icon="pi pi-check"
        severity="success"
        type="submit"
        [loading]="saving()"
      />
    </div>
  </div>

  <section class="page-card">
    <h2>使用者資料</h2>

    <div class="form-field">
      <label for="userId">使用者代碼 <span class="required">*</span></label>
      <input
        pInputText
        id="userId"
        formControlName="userId"
        placeholder="請輸入使用者代碼"
        maxlength="200"
      />
      @if (isInvalid('userId')) {
        <small class="field-error">使用者代碼為必填。</small>
      }
      @if (!isEdit()) {
        <small class="field-hint">新帳號將套用系統預設密碼，建立後可於檢視頁重設。</small>
      }
    </div>

    <div class="form-field">
      <label for="userName">使用者名稱 <span class="required">*</span></label>
      <input pInputText id="userName" formControlName="userName" maxlength="200" />
      @if (isInvalid('userName')) {
        <small class="field-error">使用者名稱為必填。</small>
      }
    </div>

    <div class="form-field">
      <label for="isActive">啟用</label>
      <p-toggleswitch inputId="isActive" formControlName="isActive" />
    </div>
  </section>

  <section class="page-card">
    <h2>角色</h2>
    <p-multiselect
      inputId="roleIds"
      formControlName="roleIds"
      [options]="roleOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="選擇角色（可複選）"
      appendTo="body"
      [filter]="true"
      [showClear]="true"
      [maxSelectedLabels]="9999"
      display="chip"
      styleClass="role-multiselect"
    />
  </section>
</form>
